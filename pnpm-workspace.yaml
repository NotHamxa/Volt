allowBuilds:
  '@parcel/watcher': false
  electron: true
  electron-winstaller: true
  esbuild: true
  extract-file-icon: true
  lzma-native: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.306'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.306'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.306'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.306'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.306'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.306'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.306'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.306'
  - '@anthropic-ai/claude-agent-sdk@0.3.306'
  - vite@6.4.5

# Force patched versions of transitive deps whose parents still pin
# vulnerable releases. Scoped per major so parents keep a compatible API.
overrides:
  '@babel/core@7': ^7.29.7
  '@modelcontextprotocol/sdk@1': ^1.32.1
  '@xmldom/xmldom@0.8': ^0.8.15
  '@xmldom/xmldom@0.9': ^0.9.12
  baseline-browser-mapping@2: ^2.11.0
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  browserslist@4: ^4.28.7
  fast-uri@3: ^3.1.6
  form-data@4: ^4.0.6
  hono@4: ^4.13.13
  http-cache-semantics@4: ^4.3.0
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  lodash@4: ^4.18.1
  minimatch@3: ^3.1.5
  minimatch@7: ^7.4.9
  nanoid@3: ^3.3.18
  picomatch@2: ^2.3.2
  postcss@8: ^8.5.25
  qs@6: ^6.16.0
  rollup@4: ^4.62.4
  source-map-js@1: ^1.2.2
  tar@7: ^7.5.22
  tmp@0.2: ^0.2.7
  undici@6: ^6.29.1
  yaml@1: ^1.10.3
